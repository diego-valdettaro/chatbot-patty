name: PR tracking

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, reopened, closed]
  workflow_dispatch:
    inputs:
      bootstrap_labels:
        description: Create or update Patty tracking labels
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sync-linked-issues:
    if: >-
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'pull_request' && (
        github.event.action == 'opened' ||
        github.event.action == 'reopened' ||
        github.event.pull_request.merged == true
      ))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const issueNumbers = [...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)]
              .map(match => Number(match[1]));
            if (issueNumbers.length !== 1) {
              core.warning('Expected exactly one linked Issue using Closes #<id>; no labels changed.');
              return;
            }

            const issue_number = issueNumbers[0];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labels = new Set((await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number }))
              .data.map(label => label.name));
            const remove = async (name) => {
              if (labels.has(name)) await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
            };
            const add = async (name) => {
              if (!labels.has(name)) await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [name] });
            };

            if (context.eventName === 'pull_request' && context.payload.pull_request.merged) {
              await remove('patty:ready');
              await remove('patty:in-progress');
              await remove('patty:review-approved');
              await add('patty:merged');
              return;
            }

            if (context.eventName === 'pull_request') {
              await remove('patty:ready');
              await add('patty:in-progress');
              return;
            }

            const state = context.payload.review.state.toLowerCase();
            if (state === 'approved') {
              await remove('patty:in-progress');
              await add('patty:review-approved');
            } else if (state === 'changes_requested') {
              await remove('patty:review-approved');
              await add('patty:in-progress');
            }
  bootstrap-labels:
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const definitions = [
              ['patty:ready', '0E8A16', 'Ready for an isolated agent task'],
              ['patty:in-progress', '1D76DB', 'PR work is active'],
              ['patty:review-approved', '5319E7', 'Linked PR has an approving review'],
              ['patty:merged', '8250DF', 'Linked PR was merged'],
              ['patty:blocked', 'D93F0B', 'Waiting on a dependency or decision'],
            ];
            for (const [name, color, description] of definitions) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                color,
                description,
              }).catch(async error => {
                if (error.status !== 422) throw error;
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  new_name: name,
                  color,
                  description,
                });
              });
            }
